<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Gallery</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="../CSS/navbar.css">
</head>
<body>

<header>
  <div id="navbar"></div>
  <h1>📂 Smart File Gallery</h1>
  <p>Upload Images & Documents (PDF, DOC, etc.)</p>
</header>

<section class="upload-section">
  <form id="uploadForm">
    <input type="text" name="title" placeholder="Enter title..." required />

    <input type="file" name="image" accept="image/*,.pdf,.doc,.docx" required />

    <button type="submit">Upload 🚀</button>
  </form>
</section>

<section class="filters">
  <button onclick="filterFiles('all')">All</button>
  <button onclick="filterFiles('image')">Images</button>
  <button onclick="filterFiles('doc')">Documents</button>
</section>

<p id="loading">Loading...</p>

<div id="imageContainer"></div>

<script src="script.js"></script>
</body>
</html>
